name: Update README numbers

# Whenever tools.json changes on main (a merged suggestion or a hand edit),
# recount the tools, categories and OPSEC ratings and update the README tables.
# Commits only when a number actually changed.
on:
  push:
    branches: [main]
    paths: ["tools.json", ".github/scripts/update-readme.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Recount tools
        run: node .github/scripts/update-readme.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet README.md; then
            echo "README numbers already match tools.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README tool counts"
          git pull --rebase origin main
          git push origin HEAD:main
